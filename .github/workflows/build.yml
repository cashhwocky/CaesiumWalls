name: Build CaesiumWalls
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 1. Create the missing Android system files
      - run: flutter create --project-name caesiumwalls --org com.alexdesrosier .
      
      # 2. Change homescreen name & update minSdk to 24 for async_wallpaper 3.5.0
      - run: |
          sed -i 's/android:label="caesiumwalls"/android:label="CaesiumWalls"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          
      # 3. Generate a custom app icon
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: convert -size 512x512 canvas:#000000 -fill "#c488ff" -pointsize 200 -gravity center -draw "text 0,0 'CW'" icon.png
      
      # 4. Inject the icon, get packages, and build the APK
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: CaesiumWalls-Release
          path: build/app/outputs/flutter-apk/app-release.apk
