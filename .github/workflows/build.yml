name: Build CaesiumWalls
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - run: flutter create --project-name caesiumwalls --org com.alexdesrosier .
      
      - run: |
          sed -i 's/android:label="caesiumwalls"/android:label="CaesiumWalls"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts
          
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: |
          convert -size 512x512 canvas:#000000 -fill "#c488ff" -pointsize 200 -gravity center -draw "text 0,0 'CW'" icon.png
          convert -size 512x512 canvas:none -fill "#c488ff" -pointsize 200 -gravity center -draw "text 0,0 'CW'" icon_foreground.png
      
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: CaesiumWalls-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
